# GoReleaser config for sentinel CLI releases (WP-16).
# Triggered by tag push via .github/workflows/release.yml.
version: 2

project_name: sentinel

before:
  hooks:
    - go mod download

builds:
  - id: sentinel
    binary: sentinel
    main: ./cmd/sentinel
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # windows/arm64 needs CGO cross toolchain; keep the matrix boring.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.CommitDate}}

archives:
  - id: sentinel
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}{{ if .IsWindows }}.zip{{ else }}.tar.gz{{ end }}
    formats:
      - tar.gz
      - zip
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

signs:
  - artifacts: checksum
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - ${artifact}
  - artifacts: archive
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --output-signature=${signature}
      - ${artifact}

brews:
  - name: sentinel
    directory: packaging/homebrew
    repository:
      owner: Ferrum-Sidereum
      name: homebrew-sentinel
    homepage: https://github.com/Ferrum-Sidereum/sentinel
    description: Sentinel secret-hygiene CLI
    skip_upload: "true"

scoops:
  - name: sentinel.json
    directory: packaging/scoop
    repository:
      owner: Ferrum-Sidereum
      name: scoop-sentinel
    homepage: https://github.com/Ferrum-Sidereum/sentinel
    description: Sentinel secret-hygiene CLI
    skip_upload: "true"

release:
  draft: false
  prerelease: auto
  name_template: "sentinel {{.Tag}}"
  notes: |
    Desktop builds are explicitly out of scope for this release.
    CLI binaries only: darwin/linux/windows on amd64/arm64 (windows/arm64 excluded).
