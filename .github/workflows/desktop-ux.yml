name: Desktop UX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-ux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cmd/sentinel-gui/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cmd/sentinel-gui/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Install isolated UI-test tooling
        run: |
          mkdir -p "$RUNNER_TEMP/sentinel-ui-tests"
          npm install --prefix "$RUNNER_TEMP/sentinel-ui-tests" --no-package-lock --no-save @playwright/test@1.51.1
          "$RUNNER_TEMP/sentinel-ui-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise localization and guardrails with a mocked Wails bridge
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --port 5173 --strictPort > "$RUNNER_TEMP/sentinel-vite.log" 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ > /dev/null
          cat > "$RUNNER_TEMP/sentinel-ui-tests/ux.spec.cjs" <<'TEST'
          const { test, expect } = require('@playwright/test');
          const base = 'http://127.0.0.1:5173/';
          async function open(page, fail = false) {
            await page.addInitScript(({ fail }) => {
              window.go = { main: { App: {
                Snapshot: async () => {
                  if (fail) throw new Error('Windows Credential Manager is unavailable. Unlock your session and retry.');
                  return { secrets: [], policy: { revision: 'test', entities: [{ name: 'EMAIL', toLLM: 'mask', toUntrusted: 'block' }], patterns: [] }, version: 'test-fixture' };
                },
                Scan: async () => ({ findings: [{ category: 'EMAIL', detector: 'test-fixture', confidence: 0.9, startByte: 8, endByte: 25 }], bytes: 25, elapsedMs: 1 }),
                AddSecret: async (name) => [{ name, placeholder: 'snt://' + name }],
                DeleteSecret: async () => [],
                SavePolicy: async (revision, entities, patterns) => {
                  if (entities.some(e => !['mask', 'block', 'off', 'allow', 'pseudonymize', 'hash', 'block_unless_placeholder', ''].includes(e.toLLM))) throw new Error('Translated enum reached backend');
                  return { revision: 'next', entities, patterns };
                },
                Activity: async () => ({ rows: [], skipped: 0, truncated: false })
              } } };
            }, { fail });
            await page.goto(base);
          }
          test('RU settings persist; language changes preserve typed text and findings', async ({ page }) => {
            await open(page);
            await page.locator('#toolbar-language').selectOption('ru');
            await expect(page.getByRole('heading', { name: 'Сначала проверьте, что отправляете.' })).toBeVisible();
            await page.getByRole('button', { name: 'Настройки', exact: true }).click();
            await expect(page.locator('#settings-language')).toHaveValue('ru');
            await page.reload();
            await expect(page.locator('#toolbar-language')).toHaveValue('ru');
            await expect(page.locator('html')).toHaveAttribute('lang', 'ru');
            await page.getByRole('button', { name: 'Открыть проверку', exact: true }).click();
            await page.getByRole('button', { name: 'Загрузить учебный пример' }).click();
            const text = await page.locator('#scan-input').inputValue();
            await page.getByRole('button', { name: 'Проверить текст', exact: true }).click();
            await expect(page.locator('tbody')).toContainText('test-fixture');
            await page.locator('#toolbar-language').selectOption('en');
            await expect(page.locator('#scan-input')).toHaveValue(text);
            await expect(page.locator('tbody')).toContainText('test-fixture');
            await page.getByRole('button', { name: 'Settings', exact: true }).click();
            await expect(page.getByRole('button', { name: 'Discard and leave' })).toBeVisible();
            await page.getByRole('button', { name: 'Keep editing', exact: true }).click();
            await expect(page.locator('#scan-input')).toHaveValue(text);
          });
          test('Russian labels keep policy enum values; save still requires review', async ({ page }) => {
            await open(page);
            await page.locator('#toolbar-language').selectOption('ru');
            await page.getByRole('button', { name: 'Правила', exact: true }).click();
            const mode = page.getByLabel('EMAIL: Для LLM', { exact: true });
            await mode.selectOption('block');
            await expect(mode).toHaveValue('block');
            await page.getByRole('button', { name: 'Проверить изменения' }).click();
            await page.getByRole('button', { name: 'Подтвердить и сохранить' }).click();
            await expect(page.getByRole('status')).toContainText('Политика сохранена');
          });
          test('destructive secret action requires exact name; value is cleared on save', async ({ page }) => {
            await open(page);
            await page.locator('#toolbar-language').selectOption('ru');
            await page.getByRole('button', { name: 'Секреты', exact: true }).click();
            await page.getByLabel('Имя', { exact: true }).fill('demo');
            await page.getByLabel('Значение секрета', { exact: true }).fill('dummy-test-only');
            await page.getByRole('button', { name: 'Добавить секрет', exact: true }).click();
            await expect(page.getByLabel('Значение секрета', { exact: true })).toHaveValue('');
            await page.getByRole('button', { name: 'Удалить…', exact: true }).click();
            const remove = page.getByRole('button', { name: 'Удалить безвозвратно', exact: true });
            await expect(remove).toBeDisabled();
            await page.getByLabel('Подтвердите имя записи').fill('wrong');
            await expect(remove).toBeDisabled();
            await page.getByLabel('Подтвердите имя записи').fill('demo');
            await remove.click();
            await expect(page.getByText('Хранилище пока пусто.', { exact: true })).toBeVisible();
            const stored = await page.evaluate(() => JSON.stringify(localStorage));
            expect(stored).not.toContain('dummy-test-only');
          });
          test('language remains accessible when startup fails', async ({ page }) => {
            await open(page, true);
            await page.locator('#boot-language').selectOption('ru');
            await expect(page.getByRole('heading', { name: 'Sentinel требуется помощь' })).toBeVisible();
            await expect(page.getByRole('alert')).toContainText('Диспетчер учётных данных Windows недоступен');
            await expect(page.getByRole('button', { name: 'Повторить', exact: true })).toBeVisible();
          });
          test('Russian navigation remains usable on a narrow viewport', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await open(page);
            await page.locator('#toolbar-language').selectOption('ru');
            await page.getByRole('button', { name: 'Настройки', exact: true }).click();
            await expect(page.locator('#settings-language')).toBeVisible();
            expect(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1)).toBeTruthy();
          });
          TEST
          cd "$RUNNER_TEMP/sentinel-ui-tests"
          ./node_modules/.bin/playwright test ux.spec.cjs --workers=1 --reporter=line
      - name: Document verification scope
        if: always()
        run: |
          echo '## Desktop UX checks' >> "$GITHUB_STEP_SUMMARY"
          echo 'See steps for pass/fail. TypeScript/build plus Chromium tests with a MOCKED Wails bridge. Covers RU/EN persistence, preserved input/results, policy enum stability, deletion confirmation and translated startup failures. Does not establish native desktop, keychain or Go backend correctness.' >> "$GITHUB_STEP_SUMMARY"
